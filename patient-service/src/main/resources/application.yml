server:
    port: 8081

spring:
    application:
        name: patient-service
    datasource:
        url: jdbc:postgresql://localhost:5432/patient_db
        username: postgres
        password: 123456
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true

eureka:
    client:
        service-url:
            defaultZone: http://localhost:8761/eureka/
